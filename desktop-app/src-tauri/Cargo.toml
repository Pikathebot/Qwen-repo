[package]
name = "jarvis-desktop"
version = "0.1.0"
description = "Jarvis - Local AI Command Center"
authors = ["Jarvis Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "shell-open", "global-shortcut-all", "window-hide", "window-show", "window-set-focus", "window-start-dragging" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
